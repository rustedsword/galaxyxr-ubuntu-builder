name: image

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap f2fs-tools dosfstools
          sudo modprobe f2fs
      - name: Build
        run: ./build-ubuntu-usb-rescue.sh ubuntu-usb-rescue.img
      - uses: actions/upload-artifact@v7
        with:
          path: ubuntu-usb-rescue.img.xz
          archive: false
